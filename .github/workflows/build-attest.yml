# Two phases, dispatched by Mytko for one release (see Mytko docs/external-deploy-oci-attestation.md):
#   mode=build   build the exact merged commit (only code that reached main) into a single-platform image on GHCR and
#                sign it keylessly. Its digest goes into the release's deploy profile, which Mytko pins before the
#                release exists (the profile digest is an input of the statement, so it cannot come out of the same run).
#   mode=attest  for an image this workflow built and signed from that commit, attest the Mytko RuntimeStatement
#                (canonical JSON) with the identities issued by the Mytko release ledger.
# CI recomputes what it can (commit on main, source archive digest, image signature and revision label) and fails
# closed on any mismatch.
name: build-attest
# Mytko finds its run by the request id at the end of the name (never by time alone).
run-name: build-attest ${{ inputs.mode }} ${{ inputs.request_id }}
on:
  workflow_dispatch:
    inputs:
      mode: {description: "build | attest", required: true}
      merged_sha: {description: Full merged commit SHA, required: true}
      project_id: {description: "Mytko project id (attest)", required: false, default: ""}
      release_id: {description: "Mytko release id (attest)", required: false, default: ""}
      source_archive_digest: {description: "sha256 of `git archive --format=tar <sha>` recorded by the ledger (attest)", required: false, default: ""}
      profile_digest: {description: "Mytko deploy profile digest (attest)", required: false, default: ""}
      image: {description: "ghcr.io/<repo>@sha256:<digest> built by mode=build (attest)", required: false, default: ""}
      request_id: {description: "Mytko dispatch nonce (16 hex)", required: false, default: ""}

permissions: {}

env:
  # Pinned base image (digest). Changing it changes the recipe inputs and therefore the statement.
  NODE_IMAGE: node:24-bookworm-slim@sha256:c86ecead9e55a5210ac1727de38a4ca840bf03dcaf34dc9749addbf383b1920c
  BUILDER_ID: gha-todo-app
  PREDICATE_TYPE: https://mytko.dev/attestation/runtime-statement/v1
  INPUTS_PREDICATE_TYPE: https://mytko.dev/attestation/build-inputs/v1
  OIDC_ISSUER: https://token.actions.githubusercontent.com

jobs:
  build:
    if: inputs.mode == 'build'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write   # keyless signing identity
    steps:
      - name: Validate the inputs before anything uses them
        env:
          MODE: ${{ inputs.mode }}
          SHA: ${{ inputs.merged_sha }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ -z "$REQUEST_ID" || "$REQUEST_ID" =~ ^[0-9a-f]{16}$ ]]
          [[ "$MODE" = "build" || "$MODE" = "attest" ]]
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.merged_sha }}
          path: src
          fetch-depth: 0
          persist-credentials: false
      - name: Only code that reached main
        env:
          SHA: ${{ inputs.merged_sha }}
        working-directory: src
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SHA"
          git merge-base --is-ancestor "$SHA" origin/main
      - uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2
      - name: Build, push and sign (single-platform manifest, no buildx provenance)
        env:
          SHA: ${{ inputs.merged_sha }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: src
        run: |
          set -euo pipefail
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx build --platform linux/amd64 --provenance=false --sbom=false \
            --build-arg "NODE_IMAGE=$NODE_IMAGE" --build-arg "GIT_REVISION=$SHA" \
            --tag "$repo:${SHA:0:12}" --push --metadata-file meta.json .
          digest="$(python3 -c 'import json;print(json.load(open("meta.json"))["containerimage.digest"])')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          image="$repo@$digest"
          cosign sign --yes "$image"
          # Build inputs measured HERE, on the runner and workflow ref that produced the image, and signed with it:
          # mode=attest copies them from this attestation instead of measuring its own runner.
          h() { printf 'sha256:%s' "$(sha256sum | cut -d' ' -f1)"; }
          python3 - "$image" "$SHA" \
            "$(h < Dockerfile)" "$(cat backend/package-lock.json frontend/package-lock.json | h)" \
            "$(printf '%s' "$NODE_IMAGE" | h)" "$(docker buildx version | h)" \
            "$(printf 'NODE_IMAGE=%s\nGIT_REVISION=%s\n' "$NODE_IMAGE" "$SHA" | h)" \
            "$(printf 'docker buildx build --platform linux/amd64 --provenance=false --sbom=false --build-arg NODE_IMAGE=%s --build-arg GIT_REVISION=%s .\n' "$NODE_IMAGE" "$SHA" | h)" \
            > "$GITHUB_WORKSPACE/build-inputs.json" <<'PY'
          import json, sys
          image, sha, recipe, deps, base, tool, params, invocation = sys.argv[1:]
          print(json.dumps({"version": 1, "image": image, "merged_sha": sha, "platform": "linux/amd64",
                            "inputs": {"recipe": recipe, "dependencies": deps, "base_images": base,
                                       "toolchain": tool, "parameters": params, "invocation": invocation}},
                           sort_keys=True))
          PY
          cosign attest --yes --type "$INPUTS_PREDICATE_TYPE" --predicate "$GITHUB_WORKSPACE/build-inputs.json" "$image"
          echo "$image" > "$GITHUB_WORKSPACE/image.txt"
          echo "IMAGE=$image" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image
          path: image.txt

  attest:
    if: inputs.mode == 'attest'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Validate the inputs before anything uses them
        env:
          MODE: ${{ inputs.mode }}
          SHA: ${{ inputs.merged_sha }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ -z "$REQUEST_ID" || "$REQUEST_ID" =~ ^[0-9a-f]{16}$ ]]
          [[ "$MODE" = "build" || "$MODE" = "attest" ]]
      # Trusted CI tooling comes from the workflow's own ref; the code being attested (src/) can never alter it.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: ci
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.merged_sha }}
          path: src
          fetch-depth: 0
          persist-credentials: false
      - name: Bind to the exact commit and archive
        env:
          SHA: ${{ inputs.merged_sha }}
          ARCHIVE: ${{ inputs.source_archive_digest }}
        working-directory: src
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SHA"
          git merge-base --is-ancestor "$SHA" origin/main   # only code that reached main
          actual="sha256:$(git archive --format=tar "$SHA" | sha256sum | cut -d' ' -f1)"
          test "$actual" = "$ARCHIVE" || { echo "source archive digest mismatch: $actual"; exit 1; }
      - uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2
      - name: The image was built and signed by this workflow from that commit
        env:
          SHA: ${{ inputs.merged_sha }}
          IMAGE: ${{ inputs.image }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          [[ "$IMAGE" =~ ^ghcr\.io/[a-z0-9._/-]+@sha256:[0-9a-f]{64}$ ]]
          test "${IMAGE%@*}" = "$repo"
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/build-attest.yml@refs/heads/main"
          cosign verify --certificate-identity "$identity" --certificate-oidc-issuer "$OIDC_ISSUER" "$IMAGE" > /dev/null
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          revision="$(docker buildx imagetools inspect "$IMAGE" --format '{{ index .Image.Config.Labels "org.opencontainers.image.revision" }}')"
          test "$revision" = "$SHA" || { echo "image revision label is '$revision', not $SHA"; exit 1; }
          platform="$(docker buildx imagetools inspect "$IMAGE" --format '{{ .Image.OS }}/{{ .Image.Architecture }}')"
          test "$platform" = "linux/amd64"
      - name: Create the RuntimeStatement
        env:
          SHA: ${{ inputs.merged_sha }}
          PROJECT_ID: ${{ inputs.project_id }}
          RELEASE_ID: ${{ inputs.release_id }}
          ARCHIVE: ${{ inputs.source_archive_digest }}
          PROFILE: ${{ inputs.profile_digest }}
          IMAGE: ${{ inputs.image }}
        working-directory: src
        run: |
          set -euo pipefail
          [[ "$PROJECT_ID" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]
          [[ "$RELEASE_ID" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]
          # The build inputs signed by the build run of this same workflow identity (never re-measured here).
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/build-attest.yml@refs/heads/main"
          cosign verify-attestation --type "$INPUTS_PREDICATE_TYPE" --certificate-identity "$identity" \
            --certificate-oidc-issuer "$OIDC_ISSUER" "$IMAGE" > "$GITHUB_WORKSPACE/inputs.jsonl"
          eval "$(python3 - "$GITHUB_WORKSPACE/inputs.jsonl" "$IMAGE" "$SHA" <<'PY'
          import base64, json, re, shlex, sys
          path, image, sha = sys.argv[1:]
          found = []
          for line in open(path):
              if not line.strip():
                  continue
              statement = json.loads(base64.b64decode(json.loads(line)["payload"]))
              predicate = statement.get("predicate") or {}
              subject = (statement.get("subject") or [{}])[0]
              if (predicate.get("version") == 1 and predicate.get("image") == image and predicate.get("merged_sha") == sha
                      and subject.get("digest", {}).get("sha256") == image.split(":")[-1]):
                  found.append(predicate["inputs"])
          if len({json.dumps(f, sort_keys=True) for f in found}) != 1:
              sys.exit("expected exactly one signed set of build inputs for this image and commit")
          inputs = found[0]
          names = ("recipe", "dependencies", "base_images", "toolchain", "parameters", "invocation")
          if set(inputs) != set(names) or not all(re.fullmatch(r"sha256:[0-9a-f]{64}", inputs[n]) for n in names):
              sys.exit("malformed build inputs")
          for name in names:
              print(f"input_{name}={shlex.quote(inputs[name])}")
          PY
          )"
          # The recipe and dependencies of this commit must still be what the build measured.
          h() { printf 'sha256:%s' "$(sha256sum | cut -d' ' -f1)"; }
          test "$(h < Dockerfile)" = "$input_recipe"
          test "$(cat backend/package-lock.json frontend/package-lock.json | h)" = "$input_dependencies"
          python3 "$GITHUB_WORKSPACE/ci/scripts/oci/make_statement.py" \
            --project-id "$PROJECT_ID" --release-id "$RELEASE_ID" \
            --merged-sha "$SHA" --source-archive-digest "$ARCHIVE" \
            --profile-digest "$PROFILE" --image "$IMAGE" \
            --builder "$BUILDER_ID" --platform linux/amd64 \
            --input "recipe=$input_recipe" --input "dependencies=$input_dependencies" \
            --input "base_images=$input_base_images" --input "toolchain=$input_toolchain" \
            --input "parameters=$input_parameters" --input "invocation=$input_invocation" \
            > "$GITHUB_WORKSPACE/statement.json"
          sha256sum "$GITHUB_WORKSPACE/statement.json"
      - name: Attest (keyless)
        env:
          IMAGE: ${{ inputs.image }}
        run: |
          set -euo pipefail
          cosign attest --yes --type "$PREDICATE_TYPE" --predicate "$GITHUB_WORKSPACE/statement.json" "$IMAGE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: runtime-statement
          path: statement.json
