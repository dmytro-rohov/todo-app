# Disposable local/CI stack: PostgreSQL + the exact prebuilt release image.
# Driven by deploy/smoke-test.sh. Test-only credentials, loopback ports only.

name: mytko-tasks-test

x-hardening: &hardening
  image: ${TEST_IMAGE:?set TEST_IMAGE to the immutable preloaded artifact}
  read_only: true
  init: true
  user: "1000:1000"
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs:
    - /tmp:size=16m,mode=1777,noexec,nosuid,nodev

services:
  db:
    image: ${TEST_POSTGRES_IMAGE:?set approved PostgreSQL 17 digest}
    environment:
      POSTGRES_PASSWORD: superuser-test-only
    volumes:
      - ${TEST_INITDB_SQL:-./test/initdb.sql}:/docker-entrypoint-initdb.d/initdb.sql:ro
      - dbdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${TEST_DB_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "tasks_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    <<: *hardening
    command: ["node", "backend/migrate.js"]
    environment:
      MIGRATION_DATABASE_URL: postgres://tasks_owner:owner-test-only@db:5432/tasks_test
      APP_DB_ROLE: tasks_app
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    healthcheck:
      disable: true

  app:
    <<: *hardening
    environment:
      DATABASE_URL: postgres://tasks_app:app-test-only@db:5432/tasks_test
      PUBLIC_ORIGIN: https://task.mytko.dev
      TRUST_PROXY: loopback, uniquelocal
      AUTH_USERNAME: owner
      # hash of "test-only-password"
      AUTH_PASSWORD_HASH: "scrypt:16384:8:1:hDX18qgPCawsPpbprjvkBw==:INT4yIkfvL190MRpfRUbjQXsIR55Qsetv+0T+Bp3ohM="
      SHUTDOWN_TIMEOUT_MS: "10000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${TEST_APP_PORT:-3101}:3000"
    stop_grace_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
          pids: 128

volumes:
  dbdata:
