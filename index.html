    </header>
    <main id="main">
        <section class="app">
            <div class="app-content container section-paddings">
                <div class="titles-box">
                    <h1 class="h1">Aplikacja To-Do</h1>
                    <p class="title-text">Zarządzaj swoimi codziennymi obowiązkami z lekkością.</p>
                </div>
                <div class="list-container">
                    <div class="column-left">
                        <div class="serach-box">
                            <input type="text" class="add-task-input input-style" placeholder="Co jest do zrobienia?">
                            <button class="btn primary-btn add-btn">Dodaj</button>
                        </div>
                        <div class="tasks-wrapper">
                            <div class="tasks">
                                <div class="tasks-top">
                                    <div class="task-top__date">
                                        <div class="label date">Dzisiaj</div>
                                        <span>Moje zadania:</span>
                                    </div>
                                    <div class="counter"></div>
                                </div>
                                <ul class="tasks-container">
                                </ul>
                                <div class="tasks-bottom">
                                    <button class="btn third-btn delete-btn">Wyczyść wszystko</button>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="column-right">
                        <div class="progres">
                            <h2 class="h2">Twój postęp</h2>
                            <div class="circular-progress" data-inner-circle-color="white" data-percentage="0" data-progress-color="#4E45E4" data-bg-color="black">
                               <div class="inner-circle"></div>
                               <p class="percentage">0%</p>
                            </div>
                            <p class="progress-text">Zacznij działać 💪</p>
                        </div>
                        <div class="categories">
                            <h2 class="h2">Kategorie</h2>
                            <ul class="categories-list">
                                <li class="category-item active">
                                    <span class="category-item__color"></span>
                                    <p>Praca</p>
                                    <span class="category-item__number">12</span>
                                </li>
                                <li class="category-item">
                                    <span class="category-item__color"></span>
                                    <p>Dom</p>
                                    <span class="category-item__number">20</span>
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <footer id="footer">
        <section class="footer">
            <div class="footer-content">
                <p class="clause">© 2026 Zadanko. Wszelkie prawa zastrzeżone.</p>
            </div>
        </section>
    </footer>
    <!-- POPUPS -->
     <div class="modal-overlay hidden">
         <div class="modal task-popup">
            <div class="modal-content">
                <div class="modal-main">
                    <h2 class="modal-title">Nowe zadanie</h2>
                    <button class="btn delete-one cancel-btn"></button>
                    <div class="modal-group">
                        <p class="modal-text">Treść zadania</p>
                        <input type="text" placeholder="Co jest do zrobienia?" class="modal-input input-style">
                    </div>
                    <div class="modal-group">
                        <div class="wrapper">
                            <p class="modal-text">Wybierz kategorię</p>
                            <button class="add-category-btn btn third-btn">+ Dodaj kategorie</button>
                        </div>
                        <div class="new-category hidden">
                            <input type="text" class="new-category-input input-style">
                        </div>
                    </div>
                    <ul class="modal-categories">
                        <li class="modal-category"><a href="" class="category">Praca</a></li>
                    </ul>
                </div>
                <div class="modal-actions">
                    <button class="cancel-btn btn secondary-btn">Anuluj</button>
                    <button class="confirm-btn btn primary-btn">Dodaj</button>
                </div>
            </div>
         </div>
     </div>
    <script src="./scripts/script.js"></script>
</body>
</html>
